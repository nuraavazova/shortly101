limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/m;

upstream shortly_app { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    client_max_body_size 1m;

    ssl_certificate     /etc/nginx/certs/shortly.crt;
    ssl_certificate_key /etc/nginx/certs/shortly.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "no-referrer"      always;
    add_header Content-Security-Policy    "default-src 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()"   always;
    server_tokens off;
    limit_req_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        expires 7d;
        proxy_pass http://shortly_app;
    }

    location /api/admin/ {
        limit_req zone=admin burst=3 nodelay;
        proxy_pass http://shortly_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://shortly_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
